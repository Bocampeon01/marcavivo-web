<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarcaVivo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0E12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MarcaVivo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="stylesheet" href="app.css">
<style>
  /* Pantalla de inicio: sesión de Google y transmisiones programadas del canal (home_page.dart). */
  body { background: var(--fondo); overflow: hidden; }
  #cargando, #entrada, #principal { height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #cargando { display: flex; align-items: center; justify-content: center; color: var(--suave); }

  /* Sin sesión. */
  #entrada { display: flex; align-items: center; justify-content: center; overflow: auto; }
  #entrada .caja { width: 460px; max-width: 100%; padding: 16px; display: flex; flex-direction: column; text-align: center; }
  #entrada h1 { font-size: 26px; margin: 0 0 8px; }
  #entrada p { color: rgba(255,255,255,.6); margin: 0 0 24px; line-height: 1.45; }
  #bEntrar { height: 52px; font-weight: 700; }
  .error { color: #FFAB40; margin-top: 16px; white-space: pre-line; line-height: 1.4; }
  #entrada .texto { margin-top: 12px; align-self: center; }

  /* Con sesión: panel a la izquierda y lista a la derecha. */
  #principal { display: flex; }
  #panel { width: 300px; flex: none; background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  #panel .marca { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  #panel .marca b { font-size: 20px; }
  #panel .marca span { font-size: 12px; color: var(--tenue); }
  .rotulo { font-size: 12px; color: rgba(255,255,255,.54); }
  #canal { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  #vence { font-size: 12px; color: rgba(255,255,255,.54); }
  #panel .hueco { flex: 1; }
  #panel .borde { height: 40px; }
  #lista { flex: 1; min-width: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }

  .tarjeta { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; background: #1A2029; width: 100%; text-align: left; justify-content: flex-start;
    white-space: normal; font-weight: 400; flex: none; }
  .tarjeta svg.ic { width: 24px; height: 24px; }
  .tarjeta b { display: block; font-size: 15px; margin-bottom: 2px; }
  .tarjeta small { color: rgba(255,255,255,.6); font-size: 12px; }
  .tarjeta.verde { background: #14301C; } .tarjeta.verde svg.ic { color: #69F0AE; }
  .tarjeta.azul { background: #142440; } .tarjeta.azul svg.ic { color: #40C4FF; }
  .tarjeta.gris svg.ic { color: #FF5252; }
  .tarjeta.falta { opacity: .55; }

  .item { padding: 8px; }
  .item.vieja { opacity: .6; }
  .item img, .item .sinFoto { width: 128px; height: 72px; border-radius: 4px; object-fit: cover; background: rgba(0,0,0,.26); flex: none; display: block; }
  .item .datos { flex: 1; min-width: 0; }
  .item .titulo { font-size: 16px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .linea { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: rgba(255,255,255,.6); }
  .item .linea span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .etiqueta { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; color: #fff; background: #607D8B; flex: none; }
  .etiqueta.vivo { background: #F44336; }
  .etiqueta.celular { background: #EF6C00; }
  .item .celu { color: #FFAB40; font-size: 12px; margin-top: 4px; }
  .vacio { text-align: center; color: rgba(255,255,255,.6); padding: 24px; line-height: 1.5; }
  #cabeceraViejas { justify-content: flex-start; gap: 8px; padding: 10px 4px; color: rgba(255,255,255,.54); font-weight: 700; border-radius: 6px; flex: none; }
  #errorLista { text-align: center; padding: 24px; }
  #errorLista .borde { height: 40px; padding: 0 18px; margin-top: 12px; }
</style>
</head>
<body>

<div id="cargando">Cargando…</div>

<section id="entrada" hidden>
  <div class="caja">
    <h1 class="negrita">MarcaVivo</h1>
    <p>Iniciá sesión con la cuenta de YouTube del canal.<br>
       En la web la sesión dura una hora: después hay que tocar el botón de nuevo, casi siempre sin volver a escribir la contraseña.</p>
    <button class="lleno" id="bEntrar"></button>
    <div class="error" id="errorEntrada" hidden></div>
    <button class="texto" id="bManualEntrada">Transmitir con la clave del servidor</button>
    <button class="texto" id="bPruebaEntrada" style="font-size:12px;color:var(--tenue)">Pantalla de prueba</button>
  </div>
</section>

<section id="principal" hidden>
  <aside id="panel">
    <div class="marca"><b class="negrita">MarcaVivo</b><span id="version"></span></div>
    <div>
      <div class="rotulo">Canal</div>
      <div id="canal">…</div>
      <div id="vence"></div>
    </div>
    <div class="hueco"></div>
    <button class="borde" id="bActualizar"></button>
    <button class="borde" id="bCambiar"></button>
    <button class="texto" id="bManual">Transmitir con la clave del servidor</button>
  </aside>
  <div id="lista"></div>
</section>

<div id="capa" hidden></div>
<div id="aviso" hidden></div>
<div id="girar">Girá el celular:<br>MarcaVivo se usa en horizontal.</div>

<script type="module" src="inicio.js"></script>
</body>
</html>
