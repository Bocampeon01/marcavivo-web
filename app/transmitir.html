<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MarcaVivo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MarcaVivo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<style>
  /* Pantalla de transmisión: misma distribución, medidas y colores que stream_page.dart y
     match_controls.dart de la app de Android (tema oscuro de Material 3). */
  @font-face { font-family: 'Roboto MarcaVivo'; src: url(roboto-bold.ttf); font-weight: 700; }
  :root {
    color-scheme: dark;
    --panel: #12161C; --texto: #E3E2E6; --suave: rgba(255,255,255,.7); --tenue: rgba(255,255,255,.38);
    --primario: #AAC7FF; --sobre-primario: #0A305F; --tonal: #3E4759; --sobre-tonal: #DAE2F9;
    --borde: #8E9099; --borde-suave: rgba(255,255,255,.24); --azul: #1565C0; --ambar: #FFC107;
    --verde: #388E3C; --rojo: #D32F2F; --gris-azul: #607D8B; --cartel: #1E242C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--texto); overflow: hidden;
    font: 14px/1.25 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  b, strong, .negrita { font-family: 'Roboto MarcaVivo', Roboto, system-ui, sans-serif; font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 100px;
    font-weight: 500; letter-spacing: .1px; white-space: nowrap; }
  button:disabled { opacity: .38; cursor: default; }
  button.lleno { background: var(--primario); color: var(--sobre-primario); }
  button.tonal { background: var(--tonal); color: var(--sobre-tonal); }
  button.borde { border: 1px solid var(--borde); color: var(--primario); }
  button.texto { color: var(--primario); padding: 0 12px; height: 40px; }
  button:not(:disabled):active { filter: brightness(1.25); }
  svg.ic { width: 1.3em; height: 1.3em; fill: currentColor; flex: none; }

  #app { display: flex; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #izq { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 6px 4px 6px 8px; gap: 6px; }

  /* Fila de estado: punto + texto, y a la derecha red y micrófono. */
  #filaEstado { display: flex; align-items: center; gap: 8px; height: 32px; flex: none; }
  #punto { width: 12px; height: 12px; border-radius: 50%; background: #9E9E9E; flex: none; }
  #estadoTxt { font-size: 16px; font-weight: 700; color: #9E9E9E; flex: none; }
  #detalle { flex: 1; min-width: 0; font-size: 11px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bRed { height: 28px; padding: 0 10px; font-size: 11px; font-weight: 700; flex: none; }
  .icono { width: 36px; height: 36px; flex: none; color: var(--suave); }
  .icono svg.ic { width: 22px; height: 22px; }
  #bMic.apagado { color: #FF5252; }

  /* Vista previa: el cuadro que sale al aire, con el zoom al costado. */
  #vista { flex: 1; min-height: 0; display: flex; gap: 4px; }
  #marco { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #lienzo { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #0B0E12; display: block; }
  #sinCamara { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;
    text-align: center; padding: 16px; color: var(--suave); background: rgba(0,0,0,.6); }
  #sinCamara button { height: 40px; padding: 0 18px; }
  #zoom { width: 34px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,.54); font-size: 11px; }
  #zoom input { flex: 1; min-height: 0; width: 24px; writing-mode: vertical-lr; direction: rtl; accent-color: var(--primario); }

  /* Abajo: mensaje y botón principal. */
  #filaBoton { display: flex; align-items: center; gap: 8px; height: 50px; flex: none; }
  #mensaje { flex: 1; min-width: 0; font-size: 12px; color: var(--suave); max-height: 50px; overflow: hidden; line-height: 1.3; }
  #bPrincipal { height: 46px; padding: 0 22px; font-size: 16px; font-weight: 700; color: #fff; background: var(--verde); flex: none; min-width: 190px; }
  #bPrincipal.rojo { background: var(--rojo); }
  #bPrincipal.gris { background: var(--gris-azul); }
  #bReiniciar { font-size: 12px; height: 34px; flex: none; }

  /* Panel de la derecha: los controles del partido. */
  #panel { width: 300px; flex: none; background: var(--panel); padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .equipos { display: flex; gap: 8px; }
  .equipo { flex: 1; min-width: 0; }
  .cab { display: flex; align-items: center; gap: 6px; height: 28px; }
  .colores { width: 12px; height: 16px; border: .5px solid rgba(255,255,255,.54); display: flex; flex-direction: column; flex: none; }
  .colores i { flex: 1; }
  .cab .nombre { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cab .tantos { font-size: 22px; font-weight: 700; }
  .botones { display: flex; gap: 6px; margin-top: 4px; }
  .botones .menos { width: 44px; height: 44px; flex: none; }
  .botones .mas { flex: 1; height: 44px; font-size: 18px; font-weight: 700; }
  .filaReloj { display: flex; align-items: center; margin-top: 6px; height: 32px; }
  .pastilla { height: 32px; padding: 0 10px; margin-right: 4px; font-size: 14px; font-weight: 700; border: 1px solid var(--borde-suave); color: rgba(255,255,255,.54); }
  .pastilla.actual { background: var(--azul); border-color: var(--azul); color: #fff; }
  #reloj { flex: 1; text-align: right; font-size: 24px; font-weight: 700; color: var(--suave); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  #reloj.ambar { color: var(--ambar); }
  #reloj.largo { font-size: 17px; }
  #bSentido { width: 32px; height: 32px; margin-left: 4px; flex: none; }
  #bSentido svg.ic { width: 18px; height: 18px; }
  .filaAccion { display: flex; gap: 6px; margin-top: 4px; }
  #bAccion { flex: 1; height: 40px; font-size: 14px; }
  #bAjustar { width: 40px; height: 40px; flex: none; }
  .filaAjustes { display: flex; gap: 2px; margin-top: 6px; }
  .filaAjustes button { flex: 1; height: 32px; font-size: 11px; min-width: 0; }
  .filaPantalla { display: flex; gap: 6px; margin-top: 6px; }
  .filaPantalla button { flex: 1; height: 36px; font-size: 12px; font-weight: 600; min-width: 0; padding: 0 4px; }
  .tituloExc { font-size: 11px; color: var(--tenue); letter-spacing: 1px; margin-top: 4px; }
  .filaExc { display: flex; gap: 4px; margin-top: 4px; }
  .casilla { flex: 1; height: 34px; min-width: 0; border: 1px solid var(--borde-suave); color: rgba(255,255,255,.54); font-size: 14px; gap: 5px; }
  .casilla.ocupada { border-color: var(--ambar); color: var(--texto); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .casilla i { width: 6px; height: 22px; display: block; }

  /* Carteles (como DialogoApp): encabezado celeste, cuerpo oscuro. */
  #capa { position: fixed; inset: 0; background: rgba(0,0,0,.54); display: flex; align-items: center; justify-content: center; padding: 8px; z-index: 10; }
  #capa.arriba { align-items: flex-start; }
  #capa[hidden] { display: none; }
  .cartel { background: var(--cartel); border-radius: 12px; overflow: hidden; width: 300px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column;
    box-shadow: 0 8px 28px rgba(0,0,0,.6); -webkit-user-select: text; user-select: text; }
  .cartel.ancho { width: 420px; }
  .cartel.banner { width: 560px; flex-direction: row; align-items: center; gap: 6px; padding: 8px; }
  .cartel header { background: var(--azul); color: #fff; padding: 9px 14px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex: none; }
  .cartel .cuerpo { overflow: auto; padding: 14px 16px; font-size: 14px; }
  .cartel .cuerpo.lista { padding: 0; }
  .cartel .acciones { display: flex; justify-content: flex-end; gap: 4px; padding: 4px 8px 8px; flex: none; flex-wrap: wrap; }
  .cartel .acciones .lleno { height: 40px; padding: 0 20px; }
  .opcion { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 16px; font-size: 15px; border-radius: 0; justify-content: flex-start; font-weight: 400; }
  .opcion + .opcion, .opcion.linea { border-top: 1px solid rgba(255,255,255,.12); }
  .opcion .muestra { width: 22px; height: 22px; border: 1px solid rgba(255,255,255,.54); flex: none; }
  .opcion svg.ic { color: var(--azul); width: 20px; height: 20px; }
  .opcion.rojo, .opcion.rojo svg.ic { color: #FF5252; }
  .opcion.tenue svg.ic { color: rgba(255,255,255,.54); }
  .nota { padding: 10px 16px; font-size: 14px; color: var(--suave); }
  input.campo { font: inherit; color: var(--texto); background: transparent; border: 1px solid var(--borde); border-radius: 4px; padding: 9px 10px; min-width: 0;
    -webkit-user-select: text; user-select: text; outline: none; }
  input.campo:focus { border-color: var(--primario); }
  .cartel.banner input.campo { flex: 1; }
  .cartel.banner button { width: 44px; height: 44px; flex: none; border-radius: 100px; }
  .cartel.banner .ok { background: var(--verde); color: #fff; }
  .ponerReloj { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0; }
  .ponerReloj input { width: 62px; text-align: center; font-size: 20px; font-weight: 700; }
  .ponerReloj .lleno { height: 40px; padding: 0 16px; margin-left: 6px; }
  .relojGrande { text-align: center; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .deAPoco { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .deAPoco button { height: 42px; min-width: 56px; padding: 0 10px; }
  hr { border: 0; border-top: 1px solid rgba(255,255,255,.12); margin: 12px 0; }

  /* Aviso corto abajo (como el SnackBar). */
  #aviso { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #E3E2E6; color: #1A1C1E; padding: 10px 16px; border-radius: 6px;
    font-size: 13px; max-width: 80%; z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,.5); white-space: pre-line; }
  #aviso[hidden] { display: none; }

  /* MarcaVivo se usa en horizontal. */
  #girar { display: none; position: fixed; inset: 0; z-index: 30; background: #000; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 18px; }
  @media (orientation: portrait) { #girar { display: flex; } }
</style>
</head>
<body>
<div id="app">
  <section id="izq">
    <div id="filaEstado">
      <span id="punto"></span>
      <span id="estadoTxt" class="negrita">Detenido</span>
      <span id="detalle"></span>
      <button id="bRed" class="borde" title="Con qué red transmite este celular">WIFI</button>
      <button id="bMic" class="icono" title="Silenciar el micrófono"></button>
    </div>
    <div id="vista">
      <div id="marco">
        <canvas id="lienzo" width="1280" height="720"></canvas>
        <div id="sinCamara"><span>Iniciando cámara…</span></div>
      </div>
      <div id="zoom" hidden>
        <svg class="ic" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm2.5-4h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></svg>
        <input id="zoomBarra" type="range" step="0.1">
        <span id="zoomTxt">1.0x</span>
      </div>
    </div>
    <div id="filaBoton">
      <div id="mensaje"></div>
      <button id="bReiniciar" class="texto" hidden>MARCADOR EN CERO</button>
      <button id="bPrincipal" class="negrita"></button>
    </div>
  </section>

  <aside id="panel">
    <div class="equipos">
      <div class="equipo" data-local="1">
        <div class="cab"><span class="colores"><i></i><i></i></span><span class="nombre"></span><span class="tantos negrita"></span></div>
        <div class="botones"><button class="menos borde">-1</button><button class="mas lleno negrita">+1</button></div>
      </div>
      <div class="equipo" data-local="0">
        <div class="cab"><span class="colores"><i></i><i></i></span><span class="nombre"></span><span class="tantos negrita"></span></div>
        <div class="botones"><button class="menos borde">-1</button><button class="mas lleno negrita">+1</button></div>
      </div>
    </div>
    <div class="filaReloj">
      <span id="tiempos"></span>
      <span id="reloj" class="negrita"></span>
      <button id="bSentido" class="borde"></button>
    </div>
    <div class="filaAccion">
      <button id="bAccion" class="tonal"></button>
      <button id="bAjustar" class="borde icono" title="Ajustar reloj"></button>
    </div>
    <div class="filaAjustes">
      <button class="borde" data-seg="-60">-1m</button><button class="borde" data-seg="-10">-10s</button><button class="borde" data-seg="-1">-1s</button>
      <button class="borde" data-seg="1">+1s</button><button class="borde" data-seg="10">+10s</button><button class="borde" data-seg="60">+1m</button>
    </div>
    <div class="filaPantalla">
      <button id="bPantalla" class="borde">PANTALLA</button>
      <button id="bBanner" class="borde">BANNER</button>
    </div>
    <div class="tituloExc">EXCLUSIONES</div>
    <div class="filaExc" id="filaExc"></div>
  </aside>
</div>

<video id="cam" muted playsinline autoplay hidden></video>
<div id="capa" hidden></div>
<div id="aviso" hidden></div>
<div id="girar">Girá el celular:<br>MarcaVivo se usa en horizontal.</div>

<script type="module" src="transmitir.js"></script>
</body>
</html>
